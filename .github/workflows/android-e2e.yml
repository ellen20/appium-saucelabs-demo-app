name: Android E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-e2e:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download app APK
        run: |
          mkdir -p apps/android
          curl -L -o apps/android/mda-2.2.0-25.apk https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

      - name: Upload app to Sauce Storage
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: |
          curl -u $SAUCE_USERNAME:$SAUCE_ACCESS_KEY \
            -X POST "https://api.us-west-1.saucelabs.com/v1/storage/upload" \
            -F "payload=@apps/android/mda-2.2.0-25.apk" \
            -F "name=mda-2.2.0-25.apk"

      - name: Run tests on Sauce Labs cloud
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: npx wdio run wdio.sauce.conf.ts

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/